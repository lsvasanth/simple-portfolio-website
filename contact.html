<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>contact</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Young+Serif&display=swap" rel="stylesheet">


    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <div class="section-one">
            <h1 class="section-one__title">Vasanth</h1>
            <h2 class="section-one__role">Web Developer</h2>
            <a class="section-one__contact" href="index.html">Home</a>
        </div>
        <div class="contact-form">
            <form>
                <table>
                    <tr>
                        <td>Name:</td>
                        <td><input type="text" placeholder="Enter your name" class="contact-form__input"></td>

                    </tr>
                    <tr>
                        <td>Email:</td>
                        <td><input type="email" placeholder="Enter your email" class="contact-form__input"></td>

                    </tr>
                    <tr>
                        <td>Message:</td>
                        <td>
                            <textarea  class="contact-form__textarea"></textarea>
                        </td>
                    </tr>
                    <tr>
                        <td></td>
                        <td><button class="button">Submit</button></td>
                    </tr>
                </table>



            </form>

        </div>

        <div class="section-five">
            <h2 class="section-five__title">
                Social Media:
                <a href="https://in.linkedin.com/">Instagram</a>:
                <a href="https://www.instagram.com/?hl=en">Linkedin</a>
            </h2>
            <p class="section-five__desc">&copy;vasanth</p>



        </div>

</body>

</html>

</div>
